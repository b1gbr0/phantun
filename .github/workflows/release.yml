name: Build Releases
on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cross:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: full
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-gnu
          - i686-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - arm-unknown-linux-gnueabihf
          - arm-unknown-linux-musleabihf
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v5
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true
      - uses: actions-rs/cargo@v1
        with:
          use-cross: true
          command: build
          args: --release --target ${{ matrix.target }}
      - name: Rename artifacts and compress
        run: |
          cd target/${{ matrix.target }}/release
          mv client phantun_client
          mv server phantun_server
          zip phantun_${{ matrix.target }}.zip phantun_client phantun_server

      - name: Extract release notes from the tag annotation
        # The annotated tag carries the hand-written release notes. Feed them to
        # the release so its body matches the annotation verbatim — no
        # auto-generated changelog, no manual `gh release edit` afterwards.
        #
        # The tag object is fetched explicitly and its type asserted: when the
        # ref arrives lightweight, `%(contents)` silently returns the commit
        # message instead of the annotation, and the release is published with
        # the wrong body. A wrong-body release must be a red run.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          type=$(git cat-file -t "refs/tags/${TAG}")
          if [ "$type" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag (object type: ${type}); release notes live in an annotated tag"
            exit 1
          fi
          git tag -l --format='%(contents)' "$TAG" > /tmp/relnotes.md
          if [ ! -s /tmp/relnotes.md ]; then
            echo "::error::extracted release notes are empty"
            exit 1
          fi
          echo "release notes (first lines):"
          head -5 /tmp/relnotes.md

      - name: Upload Github Assets
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/*.zip
          body_path: /tmp/relnotes.md
          prerelease: ${{ contains(github.ref, '-') }}
          update_existing: true
